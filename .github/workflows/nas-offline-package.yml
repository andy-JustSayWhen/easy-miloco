name: Build NAS Offline Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag, for example v0.5"
        required: true
        default: "v0.5"
      platform:
        description: "Docker platform"
        required: true
        default: "linux/amd64"
  push:
    branches: [main, NAS]
    paths:
      - ".github/workflows/nas-offline-package.yml"
      - "nas/release/**"
      - "nas/docker/compose.ugreen-template.yaml"

permissions:
  contents: read

env:
  IMAGE: docker.io/andywu114/easy-miloco-nas

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build offline package
        shell: bash
        run: |
          set -Eeuo pipefail
          version="${{ inputs.version || 'v0.5' }}"
          platform="${{ inputs.platform || 'linux/amd64' }}"
          arch="${platform#linux/}"
          out="easy-miloco-nas-offline-${version}-${arch}"
          mkdir -p "$out"

          docker pull --platform "$platform" "${IMAGE}:${version}"
          docker save -o "$out/easy-miloco-nas-${version}-${arch}.tar" "${IMAGE}:${version}"

          cp nas/release/README.md "$out/README.md"
          cp nas/release/AGENT.md "$out/AGENT.md"
          cp nas/docker/compose.ugreen-template.yaml "$out/compose.ugreen.yaml"
          cp nas/docker/compose.ugreen-template.yaml "$out/compose.ugreen-offline.yaml"
          python3 - "$out/compose.ugreen-offline.yaml" "${IMAGE}:${version}" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          image = sys.argv[2]
          text = path.read_text(encoding="utf-8")
          text = re.sub(r"image:\s+\S+", f"image: {image}", text, count=1)
          path.write_text(text, encoding="utf-8")
          PY

          (cd "$out" && sha256sum * > SHA256SUMS.txt)
          tar -czf "${out}.tar.gz" "$out"

      - name: Upload offline package
        uses: actions/upload-artifact@v4
        with:
          name: easy-miloco-nas-offline-${{ inputs.version || 'v0.5' }}-${{ (inputs.platform || 'linux/amd64') == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: easy-miloco-nas-offline-${{ inputs.version || 'v0.5' }}-*.tar.gz
          if-no-files-found: error
